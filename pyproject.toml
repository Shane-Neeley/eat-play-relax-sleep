[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eat-play-relax-sleep"
version = "0.1.0"
description = "A local-first creative operating system for code, recordings, experiments, songs, and music videos."
requires-python = ">=3.11"
authors = [{name = "EPRS contributors"}]
dependencies = []

[project.optional-dependencies]
# Keep computer vision out of the core install.  The headless wheel is enough
# for deterministic frame QA and avoids pulling GUI/native OpenCV stacks into
# every EPRS environment.
opencv = ["opencv-python-headless>=4.11,<5"]
# Short-event ranking for field recordings.  Heavy model runtimes remain
# isolated lab installs; this extra provides only the deterministic fusion
# layer and its audio/numerical primitives.
bioacoustic = [
    "numpy>=2,<3",
    "scipy>=1.13,<2",
    "soundfile>=0.12,<1",
]
# Pedalboard is kept optional because its GPL-3.0 runtime and native wheel are
# useful for local effects work but should not be forced into every EPRS install.
pedalboard = ["pedalboard==0.9.24"]

[project.scripts]
eprs = "eprs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/eprs" = ["config/toolchain.json", "config/producer.json"]
"share/eprs/adapters" = ["config/adapters/*.json"]

[tool.ruff]
required-version = ">=0.16.2"
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# Most EPRS zip calls intentionally compare a sequence with its one-item
# offset. Requiring a strictness marker on every call adds noise here.
ignore = ["B905"]

[tool.ty.src]
# Start with production modules whose boundaries are explicit enough to make
# type checking useful. Expand this list as dynamic JSON records gain declared
# shapes instead of silencing diagnostics globally.
include = [
    "scripts/check_public_repo.py",
    "src/eprs/__init__.py",
    "src/eprs/audio.py",
    "src/eprs/beat.py",
    "src/eprs/bioacoustic_detector.py",
    "src/eprs/cli.py",
    "src/eprs/delivery.py",
    "src/eprs/frontier.py",
    "src/eprs/inaturalist_audio.py",
    "src/eprs/inaturalist_photo.py",
    "src/eprs/inaturalist_study.py",
    "src/eprs/source_audit.py",
    "src/eprs/interchange.py",
    "src/eprs/lineage.py",
    "src/eprs/master.py",
    "src/eprs/manifest.py",
    "src/eprs/production_map.py",
    "src/eprs/pedalboard_fx.py",
    "src/eprs/quality.py",
    "src/eprs/runtime.py",
    "src/eprs/selection.py",
    "src/eprs/session.py",
    "src/eprs/shotcut.py",
    "src/eprs/sonic_pi_catalog.py",
    "src/eprs/visualize.py",
    "src/eprs/visuals.py",
    "src/eprs/video_quality.py",
    "src/eprs/vgpu.py",
]

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.71",
]
